<div class="topbar">
  <div class="ribbon" aria-hidden="true"></div>
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="Onyr.net — home">
      <img class="brand-logo circle_bg" src="{{ site.baseurl }}/assets/images/logos/front_logo/front_logo_onyr_500x500.webp" alt="Onyr">
      <span class="brand-text"><span class="brand-onyr">Onyr</span><span class="dot">.net</span></span>
    </a>

    <div class="nav-links">
      {% for item in site.data.navigation %}
        <a href="{{ item.link | relative_url }}"
           class="nav-link{% if page.url == item.link %} current{% endif %}">{{ item.name }}</a>
      {% endfor %}

      <button id="theme-toggle-button" type="button" title="Toggle theme" aria-label="Toggle light and dark theme">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 32 32" fill="currentColor">
          <path d="M27.5 11.5v-7h-7L16 0l-4.5 4.5h-7v7L0 16l4.5 4.5v7h7L16 32l4.5-4.5h7v-7L32 16l-4.5-4.5zM16 25.4a9.39 9.39 0 1 1 0-18.8 9.39 9.39 0 1 1 0 18.8z" />
          <circle cx="16" cy="16" r="8.1" />
        </svg>
      </button>
    </div>
  </nav>
</div>
