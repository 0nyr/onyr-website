<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }}</title>
    <!-- Set theme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <!-- style (fonts self-hosted via @font-face in styles.css) -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css">
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="{{ site.baseurl }}/assets/favicons/site.webmanifest">
    {% feed_meta %}
    {% seo %}
    {% if site.umami.website_id %}
    <script defer src="{{ site.umami.script_url }}" data-website-id="{{ site.umami.website_id }}"></script>
    {% endif %}
  </head>
  <body class="{% if page.layout == 'home' %}is-home{% endif %}">
    {% include navigation.html %}

    <main id="general_main">
      {{ content }}
    </main>

    <footer id="general_footer">
      <div id="general_footer_container">
        <nav class="footer-nav">
          <a href="{{ '/about/' | relative_url }}">About</a> ·
          <a href="{{ '/blog/' | relative_url }}">Blog</a> ·
          <a href="{{ '/projects/' | relative_url }}">Projects</a> ·
          <a href="{{ '/publications/' | relative_url }}">Publications</a> ·
          <a href="{{ '/cv/' | relative_url }}">CV</a> ·
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
        <p>© {{ site.time | date: "%Y" }} · Onyr.net</p>
        <p>Made with <span id="heart">♥</span> in Lyon, by <a class="mono" href="https://onyr.net/">0nyr</a></p>
        <p>
          <a href="https://github.com/0nyr/onyr-website">
            <svg class="footer-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            Source code</a>
        </p>
      </div>
    </footer>

  </body>

  <!-- Scripts -->
  <script src="{{ site.baseurl }}/assets/js/theme-switch.js"></script>
  <script src="{{ site.baseurl }}/assets/js/animations.js"></script>
</html>
